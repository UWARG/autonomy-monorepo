[project]
name = "mav_comms"
version = "0.1.0"
description = "Thin MAVLink wrapper for communicating with ArduPilot/PX4."
license = "MIT"
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/UWARG/autonomy-monorepo/tree/main/mav_comms"
Issues = "https://github.com/UWARG/autonomy-monorepo/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "mav_comms"

[tool.pytest.ini_options]
testpaths = ["tests"]
