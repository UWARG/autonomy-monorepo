name = "airside"
description = "ROS 2 Humble workspace for airside autonomy."

depends_on = ["utils", "camera"]

[commands]
setup = "docker compose build"
build = "docker compose build"
run = "docker compose --profile default up"
run-non-optimal = "docker compose --profile non-optimal up"
compose-up = "docker compose --profile default up -d"
compose-up-non-optimal = "docker compose --profile non-optimal up -d"
compose-down = "docker compose --profile default --profile non-optimal down"
logs = "docker compose logs -f"
test = "echo 'Tests are not implemented yet'"
shell = "docker compose --profile default run --rm airside bash"

[ci]
pr = ["test"]
