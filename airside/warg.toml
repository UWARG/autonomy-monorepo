name = "airside"
description = "ROS 2 Humble workspace for airside autonomy."

depends_on = ["utils", "camera", "obstacle-avoidance", "perception"]

[commands]
setup = "docker compose build"
build = "docker compose build"
run = "docker compose up"
compose-up = "docker compose up -d"
compose-down = "docker compose down"
logs = "docker compose logs -f"
test = "docker compose run --rm airside bash -lc 'colcon test --event-handlers console_direct+ && colcon test-result --verbose'"
shell = "docker compose run --rm airside bash"

[ci]
pr = ["test"]
