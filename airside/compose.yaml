services:
  airside:
    build:
      context: ..
      dockerfile: airside/docker/Dockerfile
    image: warg/airside:latest
    network_mode: host
    # Fallback if host networking is unavailable:
    # ports:
    #   - "14550:14550/udp"
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      FCU_URL: ${FCU_URL:-serial:///dev/serial0:115200}
      OBSTACLE_SOURCE: ${OBSTACLE_SOURCE:-traffic}
      AEAC_URL: ${AEAC_URL:-}
      AEAC_TOKEN: ${AEAC_TOKEN:-}
      AEAC_UAV_ID: ${AEAC_UAV_ID:-}
      AEAC_OWN_AIRCRAFT_INDEX: ${AEAC_OWN_AIRCRAFT_INDEX:--1}
      AEAC_PROTOCOL_VERIFIED: ${AEAC_PROTOCOL_VERIFIED:-false}
      ROS_LOG_DIR: /ros_ws/log/ros
    devices:
      - /dev/serial0:/dev/serial0
      - /dev/ttyAMA0:/dev/ttyAMA0
      - /dev/video0:/dev/video0
    volumes:
      - ./src:/ros_ws/src
      - ./log:/ros_ws/log
      - ..:/monorepo
      - /dev/bus/usb:/dev/bus/usb
    privileged: true
    command: ros2 launch airside_bringup airside.launch.py
    restart: on-failure
