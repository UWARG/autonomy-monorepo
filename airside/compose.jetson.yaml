services:
  airside:
    runtime: nvidia
    network_mode: host
    environment:
      RERUN_VIEWER_HOST: ${RERUN_VIEWER_HOST:-127.0.0.1}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all

  vslam:
    build:
      context: ..
      dockerfile: airside/docker/Dockerfile.vslam
    image: warg/vslam:latest
    runtime: nvidia
    network_mode: host
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    restart: unless-stopped

  visualize:
    image: warg/vslam:latest
    network_mode: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RERUN_VIEWER_HOST: ${RERUN_VIEWER_HOST:?set RERUN_VIEWER_HOST to your dev machine IP}
    command: ["/bin/bash", "-lc", "python3 /rerun_bridge.py"]
    restart: unless-stopped
    depends_on:
      - vslam
