services:
  sitl:
    build:
      context: docker
      dockerfile: Dockerfile.sitl
    image: warg/sitl:latest
    ports:
      - "5760:5760"

  airside:
    build:
      context: ..
      dockerfile: airside/docker/Dockerfile
    image: warg/airside:latest
    depends_on:
      - sitl
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      PYTHONPATH: /monorepo/gnc/src
    ports:
      - "8765:8765"
    volumes:
      - ./src:/ros_ws/src
      - ./log:/ros_ws/log
      - ..:/monorepo
    command: >
      ros2 launch engine ${AIRSIDE_FOLLOW_LAUNCH:-follow_sitl.launch.py}
      fcu_url:=tcp://sitl:5760
      world_target:=${AIRSIDE_WORLD_TARGET:-true}
      lunge:=${AIRSIDE_LUNGE:-false}
      crossing:=${AIRSIDE_CROSSING:-false}
      detector_stride:=${AIRSIDE_DETECTOR_STRIDE:-1}
      sim_latency_s:=${AIRSIDE_SIM_LATENCY_S:-0.0}
      occlusion_after_s:=${AIRSIDE_OCCLUSION_AFTER_S:--1.0}
      occlusion_duration_s:=${AIRSIDE_OCCLUSION_DURATION_S:-0.0}
      drop_detector_every_n:=${AIRSIDE_DROP_DETECTOR_EVERY_N:-0}
      timing_json:=${AIRSIDE_TIMING_JSON:-}
