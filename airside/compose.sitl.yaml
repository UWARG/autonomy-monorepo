# Runs the airside stack against an ArduPilot SITL instance (e.g. Mission
# Planner's built-in simulation)
#
# Usage (from airside/):
#   docker compose -f compose.sitl.yaml up
#   SITL_HOST=<sitl-machine-ip> docker compose -f compose.sitl.yaml up
services:
  airside:
    build:
      context: ..
      dockerfile: airside/docker/Dockerfile
    image: warg/airside:latest
    network_mode: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      FCU_URL: tcp://${SITL_HOST:-127.0.0.1}:5762
      OBSTACLE_SOURCE: ${OBSTACLE_SOURCE:-traffic}
      AEAC_URL: ${AEAC_URL:-}
      AEAC_TOKEN: ${AEAC_TOKEN:-}
      AEAC_UAV_ID: ${AEAC_UAV_ID:-}
      AEAC_OWN_AIRCRAFT_INDEX: ${AEAC_OWN_AIRCRAFT_INDEX:--1}
      AEAC_PROTOCOL_VERIFIED: ${AEAC_PROTOCOL_VERIFIED:-false}
      ROS_LOG_DIR: /ros_ws/log/ros
    volumes:
      - ./src:/ros_ws/src
      - ./log:/ros_ws/log
      - ..:/monorepo
    command: ros2 launch airside_bringup airside.launch.py
