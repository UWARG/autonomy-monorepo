[project]
name = "utils"
version = "0.1.0"
description = "Shared constants, enums, and dataclasses used across all Airside modules."
license = "MIT"
requires-python = ">=3.9"
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/UWARG/autonomy-monorepo/tree/main/utils"
Issues = "https://github.com/UWARG/autonomy-monorepo/issues"

[project.optional-dependencies]
dev = ["ruff>=0.8.0", "pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
