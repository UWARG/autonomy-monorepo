name = "warg_cli"
description = "WARG autonomy monorepo developer CLI."

depends_on = []

[commands]
setup = "uv sync"
build = "uv build"
test = "uv run --extra dev pytest"
run = "uv run warg"
lint = "uv run --extra dev ruff check ."
format = "uv run --extra dev ruff format ."

[ci]
pr = ["lint", "test"]
main = ["test", "build"]
