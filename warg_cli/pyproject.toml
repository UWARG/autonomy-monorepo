[project]
name = "warg-cli"
version = "0.1.0"
description = "WARG autonomy monorepo developer CLI"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
  "InquirerPy>=0.3.4",
  "rich>=13.7.0",
  "tomli>=2.0.1; python_version < '3.11'",
  "typing-extensions>=4.10.0",
  "typer>=0.12.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[project.scripts]
warg = "cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
