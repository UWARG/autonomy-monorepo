services:
  airside-prec:
    build:
      context: ..
      dockerfile: airside_prec/docker/Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    image: uwarg/airside-prec:0.1.3
    environment:
      - ${ROS_DOMAIN_ID:-0}
      - ${DISPLAY:-host.docker.internal:0}
      - ${WAYLAND_DISPLAY:-host.docker.internal:0}
    command: ros2 launch engine engine.launch.py
    restart: unless-stopped
    volumes:
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
      - "/mnt/wslg:/mnt/wslg:rw"
      - ./src:/ros_ws/src
      - ..:/monorepo
    devices:
      - /dev/video0:/dev/video0
      - /dev/ttyAMA0:/dev/ttyAMA0
    privileged: true

