name: Publish warg-cli

on:
  push:
    tags:
      - "warg-cli/v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag version matches project version
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'warg-cli/v')
        working-directory: warg_cli
        run: |
          tag_version="${GITHUB_REF_NAME#warg-cli/v}"
          project_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as file:
              print(tomllib.load(file)["project"]["version"])
          PY
          )"

          if [ "$tag_version" != "$project_version" ]; then
            echo "Release tag version '$tag_version' does not match pyproject.toml project.version '$project_version'."
            exit 1
          fi

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        working-directory: warg_cli
        run: python -m build

      - name: Check distributions
        working-directory: warg_cli
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: warg-cli-dist
          path: warg_cli/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/warg-cli
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: warg-cli-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
