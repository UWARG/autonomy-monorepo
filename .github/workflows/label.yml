name: Label

# pull_request_target so PRs opened from forks still get a token with
# pull-requests: write. Safe here because the job never checks out or
# executes any code from the PR branch.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true
