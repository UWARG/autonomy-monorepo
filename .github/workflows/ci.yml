name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: PR CI
        if: github.event_name == 'pull_request'
        run: uv run --project warg_cli warg ci pr --base ${{ github.event.pull_request.base.sha }}

      - name: Main CI
        if: github.event_name == 'push'
        run: uv run --project warg_cli warg ci main --base ${{ github.event.before }}
