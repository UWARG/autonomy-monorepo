[project]
name = "perception"
version = "0.1.0"
description = "Perception module - computer vision and target tracking algorithms"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["numpy>=1.24.0", "shapely>=1.7.0", "utils"]

[project.urls]
Homepage = "https://github.com/UWARG/autonomy-monorepo/tree/main/perception"
Issues = "https://github.com/UWARG/autonomy-monorepo/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".."]

[tool.uv.sources]
utils = { path = "../utils" }

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
