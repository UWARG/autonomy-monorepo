services:
  sitl-plus:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 5761:5761
      - 14550:14550
    environment:
      - DEBIAN_FRONTEND=noninteractive
      - DISPLAY=${DISPLAY:-host.docker.internal:0}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-host.docker.internal:0}
      - SENSOR_HOST=host.docker.internal
    volumes:
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
      - "/mnt/wslg:/mnt/wslg:rw"
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true

