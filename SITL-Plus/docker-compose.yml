services:
  sitl-plus:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/docker/entrypoint_rerun.sh"]
    ports:
      - 5761:5761
      - 14550:14550
    environment:
      - DEBIAN_FRONTEND=noninteractive
      - SENSOR_HOST=host.docker.internal #points to the host machine so run groundside and airside on host machine eg powershell terminal instead of wsl 
    volumes:
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Required for MAVProxy: keep a live stdin/TTY so it does not EOF-exit and
    # kill ArduPilot. Run attached (`docker compose up`), not detached (`-d`).
    stdin_open: true
    tty: true
