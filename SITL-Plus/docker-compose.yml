services:
  physics:
    image: sitl-plus:local
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["uv", "run", "python3", "src/main.py"]
    environment:
      SENSOR_HOST: host.docker.internal
      DRONE_HOSTS: ${DRONE_HOSTS:-sitl-plus}
      DRONE_MODEL: ${DRONE_MODEL:-iris:Iris}
      SIM_RATE_HZ: ${SIM_RATE_HZ:-800}
    extra_hosts:
      - "host.docker.internal:host-gateway"
  sitl-plus:
    image: sitl-plus:local
    depends_on:
      - physics
    ports:
      - "5761:5761"
    environment:
      PHYSICS_HOST: physics
      SIM_RATE_HZ: ${SIM_RATE_HZ:-800}
    volumes:
      - ./logs/drone_1:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
