name = "SITL-Plus"
description = "WARG's SITL archtecture"

depends_on = []

[commands]
setup = "docker compose build"
build = "uv build"
run = "docker compose up"
compose-up = "docker compose up -d"
compose-down = "docker compose down"
test = "uv run --extra dev pytest"
rerun = "uv run rerun"
rerun_airside = "uv run python tests/integration_tests/rerun_airside.py"
lint = "uv run --extra dev ruff check ."

[ci]
pr = ["lint", "test"]
main = ["test", "build"]
