name = "ims"
description = "Intelligent Monitoring System — WebSocket server and React dashboard."

depends_on = ["utils", "mav_comms", "camera"]

[commands]
setup = "uv sync && pnpm --dir frontend install"
# TODO: add the IMS server process to Procfile.dev once server/ exposes a runnable backend entry point.
run = "uv run --extra dev honcho start -f Procfile.dev"
lint = "uv run --extra dev ruff check ."

[ci]
pr = ["lint"]
