name = "ims"
description = "Intelligent Monitoring System — WebSocket server and React dashboard."

depends_on = ["utils", "mav_comms", "camera"]

[commands]
setup = "uv sync && npm --prefix frontend install"
run = "uv run flask --app server/server run --host 0.0.0.0"
"frontend:dev" = "npm --prefix frontend run dev"
lint = "uv run --extra dev ruff check ."

[ci]
pr = ["lint"]
