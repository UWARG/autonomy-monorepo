[project]
name = "ims"
version = "0.1.0"
description = "Intelligent Monitoring System — WebSocket server and React dashboard."
license = "MIT"
requires-python = ">=3.9"
dependencies = ["flask>=3.0.0", "flask-sock>=0.7.0", "msgspec>=0.18.0"]

[project.urls]
Homepage = "https://github.com/UWARG/autonomy-monorepo/tree/main/ims"
Issues = "https://github.com/UWARG/autonomy-monorepo/issues"

[project.optional-dependencies]
dev = ["honcho>=2.0.0", "ruff>=0.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
