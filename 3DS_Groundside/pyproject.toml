[project]
name = "3DS_Groundside"
version = "0.1.0"
description = "Groundside operator tooling for 3DS autonomy."
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["websockets>=13.0"]

[project.urls]
Homepage = "https://github.com/UWARG/autonomy-monorepo/tree/main/3DS_Groundside"
Issues = "https://github.com/UWARG/autonomy-monorepo/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["src"]
