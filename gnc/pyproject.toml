[project]
name = "gnc"
version = "0.1.0"
description = "WARG autonomy airside Guidance, Navigation, and Control module"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
  "utils",
]

[tool.uv.sources]
utils = { path = "../utils" }


[project.urls]
Homepage = "https://github.com/UWARG/autonomy-monorepo/tree/main/gnc"
Issues = "https://github.com/UWARG/autonomy-monorepo/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".."]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
