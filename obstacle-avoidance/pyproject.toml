[project]
name = "obstacle-avoidance"
version = "0.1.0"
description = "Drone avoids obstacles while staying on task"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[project.urls]
Homepage = "https://github.com/UWARG/autonomy-monorepo/tree/main/obstacle-avoidance"
Issues = "https://github.com/UWARG/autonomy-monorepo/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/obstacle_avoidance"]

[tool.ruff]
line-length = 88
