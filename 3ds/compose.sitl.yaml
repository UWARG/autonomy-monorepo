# Runs the 3DS stack against an ArduPilot SITL instance (e.g. Mission
# Planner's built-in simulation)
#
# Usage (from 3ds/):
#   docker compose -f compose.sitl.yaml up
#   SITL_HOST=<sitl-machine-ip> docker compose -f compose.sitl.yaml up
services:
  3ds:
    build:
      context: ..
      dockerfile: 3ds/docker/Dockerfile
    image: warg/3ds:latest
    network_mode: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      FCU_URL: tcp://${SITL_HOST:-127.0.0.1}:5762
      ROS_LOG_DIR: /ros_ws/log/ros
    volumes:
      - ./src:/ros_ws/src
      - ./log:/ros_ws/log
      - ..:/monorepo
    command: ros2 launch airside_bringup 3ds.launch.py
