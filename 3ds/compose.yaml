services:
  3ds:
    build:
      context: ..
      dockerfile: 3ds/docker/Dockerfile
    image: warg/3ds:latest
    network_mode: host
    # Fallback if host networking is unavailable:
    # ports:
    #   - "14550:14550/udp"
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      FCU_URL: ${FCU_URL:-serial:///dev/serial0:115200}
      ROS_LOG_DIR: /ros_ws/log/ros
    devices:
      - /dev/serial0:/dev/serial0
      - /dev/ttyAMA0:/dev/ttyAMA0
      - /dev/video0:/dev/video0
    volumes:
      - ./src:/ros_ws/src
      - ./log:/ros_ws/log
      - ..:/monorepo
      - ./data:/ros_ws/data
      - /dev/bus/usb:/dev/bus/usb
    privileged: true
    command: ros2 launch airside_bringup 3ds.launch.py
    restart: on-failure
